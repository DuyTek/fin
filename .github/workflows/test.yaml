name: Frontend test
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: build-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install

      - name: Linting check
        run: bun lint

      - name: Build production
        run: bun run build

      - name: Run tests
        run: bun test --coverage
